name: minetrace

# Exact-stack infrastructure from the SIH abstract:
# PostgreSQL/PostGIS + pgvector, MinIO (S3), Keycloak, Temporal.
# The FastAPI backend runs on the host (Python venv); point it at this stack
# with MINETRACE_DB_BACKEND=postgres, MINETRACE_STORAGE_BACKEND=s3,
# MINETRACE_KEYCLOAK_ENABLED=true, MINETRACE_TEMPORAL_ENABLED=true
# (see backend/.env.example).

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: minetrace
      POSTGRES_PASSWORD: minetrace
      POSTGRES_DB: minetrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minetrace"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minetrace
      MINIO_ROOT_PASSWORD: minetrace123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/minetrace-realm.json:/opt/keycloak/data/import/minetrace-realm.json:ro

  temporal:
    image: temporalio/auto-setup:1.22.4
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: minetrace
      POSTGRES_PWD: minetrace
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
