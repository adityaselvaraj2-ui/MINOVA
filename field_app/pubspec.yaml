name: minetrace_field
description: MineTrace offline-first field capture app for foremen (shift entries with secure sync).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^3.1.0 # encrypted local queue (abstract: encrypted local storage)
  flutter_secure_storage: ^9.2.2 # JWT token + DB key at rest
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
